# ══════════════════════════════════════════════════════════════════════════
# Project A.R.I.A — Simulation Configuration
# Loaded once at startup by load_settings() (settings.cpp).
# Every key below is REQUIRED: a missing key throws std::runtime_error,
# ══════════════════════════════════════════════════════════════════════════

# ── Simulation / Window ─────────────────────────────────────────────────
[simulation]
vsync             = false
full_screen       = false
ui_scale_percent  = 100.0
max_fps_rendering = 60    # 0 = uncapped
max_fps_updating  = 60
max_runtime = 0 # simulation ends after this many seconds have passed, 0 = infinite
max_iterations = 0 # simulation ends after this many iterations, 0 = infinite


# ── World ────────────────────────────────────────────────────────────────
[world]
bounds_radius               = 42000
border_repulsion_magnitude  = 0.000000085
updating_threads = 16
tick_sim_multiplier = 1

# 5 = 32, 6 = 64, 7 = 128, 8 = 256, 9 = 512, 10 = 1024, 11 = 2048
# each of these is used to calculate the size of a square spatial grid using the formula: 2^n
collision_grid_power = 9          # The grid used to handle collisions between all bodies
food_resolution_cell_power = 9    # the grid used to handle cell food interactions
birth_cell_power = 8              # The grid used to let newborns connect with eachover
food_pheromone_grid_power = 9      # The grid used to handle food pheromone interactions

# Max Capacities for each aswell 
collision_grid_max_capacity           = 14
food_resolution_grid_max_capacity     = 14
birth_grid_max_capacity               = 4

# ── Cell Manager ─────────────────────────────────────────────────────────
[cell_manager]
max_cells                = 220000  # maximum number of cells in the simulation
initial_protozoa            = 450  # seeds to create the initial population of cells  
auto_reset_on_extinction    = true
infant_time = 500 # time in ticks that a cell is considered an infant and can form connections
speed_energy_tax = -0.4 # The Tax for not traveling fast enough

# ── Cell ─────────────────────────────────────────────────────────────────
[cell]
spawn_radius                = 50.0   # The radius of the circle in which cells are spawned at the start of the simulation
reproductive_cooldown        = 500   # 
digestive_time                = 50

initial_energy                = 70.0
bite_amount = 10.0 

integrity_conversion_rate = 0.01
nutrients_conversion_rate = 0.07

friction_energy_loss_const = 0.0075

# ── Spring ─────────────────────────────────────────────────────────────────
[spring]
maximum_extension = 380.0               # how far a spring can stretch before it breaks
spring_work_const = 0.00001             # 
spring_break_force  = 35
spring_break_length_factor = 1.5
spring_damage_threshold = 30.5
fully_developed_age = 300
nutrients_transfer_loss = 0.04
stress_damage_const = 0.095

# ── Food Manager ─────────────────────────────────────────────────────────
[food_manager]
update_freq                    = 4
max_food                    =  10000
initial_food                 = 2500
friction                      = 0.95

# color / fade
food_visibility_ramp_frames  = 90.0
food_max_alpha                = 200.0

food_random_spawn_per_frame = 1
food_random_spawn_chance = 0.03

spawn_proportionality_constant = 0.003
food_spawn_distance           = 200.0

death_age_chance               = 0.03

fade_start_nutrients = 30.0

food_launch_strength = 50
food_launch_chance = 0.05

# ── Food ─────────────────────────────────────────────────────────────────
[food]
reproductive_cooldown          = 400
nutrient_reproductive_threshold = 0.99 # ratio

initial_nutrients             = 20.0
final_nutrients                = 80.0
nutrient_development_time       = 1000

spawn_immunity = 20
vibrate_freq = 0.0065

death_age                     = 2500.0

nutrients_to_radius_scale = 0.66
vibration_strength             = 0.12

